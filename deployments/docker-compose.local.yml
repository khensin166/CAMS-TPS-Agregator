version: '3.8'

services:
  sqlserver-local:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cams-sqlserver-local
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=LocalDevStrongPassword!123
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
